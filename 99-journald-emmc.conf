# =============================================================================
# 99-journald-emmc.conf — logs systemd 100% en RAM (zéro écriture eMMC)
# =============================================================================
#
# INSTALLATION
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp 99-journald-emmc.conf /etc/systemd/journald.conf.d/99-journald-emmc.conf
#   sudo systemctl restart systemd-journald
#
# VÉRIFICATION
#   journalctl --disk-usage
#   systemctl status systemd-journald
#
# =============================================================================

[Journal]
Storage=volatile          # /run/log/journal uniquement (tmpfs), zéro écriture eMMC, perdu à chaque reboot (voulu)
Compress=yes              # Compresse les grosses valeurs de champs (LZ4, coût CPU négligeable)
MaxLevelStore=info        # Ignore les messages "debug" à la source
SplitMode=none            # Un seul fichier journal pour tout le monde, pas un par UID
ReadKMsg=no               # N'ingère plus les messages noyau (dmesg continue de fonctionner normalement)

RuntimeMaxUse=100M        # Plafond total du journal en RAM (System* ignorés en Storage=volatile, inutiles ici)
RuntimeKeepFree=200M      # Garde toujours au moins 200 Mo de RAM libre pour le reste du système
RuntimeMaxFileSize=20M    # Taille d'un fichier journal avant rotation
MaxRetentionSec=8h        # Purge agressive même sans reboot (machine allumée en continu)

RateLimitIntervalSec=30s  # Anti-spam d'un service qui logue en boucle (ex: bot en crash-loop)
RateLimitBurst=200        # Au-delà, journald suppresse silencieusement les messages du service concerné

ForwardToSyslog=no        # Pas de rsyslog sur cette machine, rien à dupliquer
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no          # Pas de terminal interactif à spammer sur un serveur headless
