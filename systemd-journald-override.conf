# =============================================================================
# systemd-journald-override.conf — priorité CPU/I/O de journald face aux bots
# =============================================================================
#
# INSTALLATION
#   sudo mkdir -p /etc/systemd/system/systemd-journald.service.d
#   sudo cp systemd-journald-override.conf /etc/systemd/system/systemd-journald.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart systemd-journald
#
# VÉRIFICATION
#   systemctl show systemd-journald --property=Nice,IOSchedulingClass,CPUWeight
#
# =============================================================================

[Service]
Nice=10                 # Moins prioritaire que les bots (Nice=-5 dans discord-bot.service)
IOSchedulingClass=idle  # N'écrit sur disque que quand rien d'autre n'attend l'I/O
CPUWeight=50            # Réduit sa part de CPU sous contention (cgroup v2, défaut 100)
