# =============================================================================
# 99-hardening.conf
# Durcissement sysctl + préservation eMMC — Ubuntu Server (ARM64)
# Cible : Orange Pi 5B / RK3588(S), usage "serveur maison toujours allumé"
# (ex: AdGuard Home, bots Node.js, petit dashboard web), sans conteneurs,
# swap géré par zram, avec ufw actif.
# =============================================================================
#
# CE FICHIER PART DE CES HYPOTHÈSES — ADAPTE-LES À TON CAS AVANT DE DÉPLOYER
#   - Client réseau standard : pas de routage/NAT/VPN gateway (sinon voir
#     net.ipv4.ip_forward / net.ipv6.conf.all.forwarding, section 3-4)
#   - Aucun conteneur Docker/Podman/LXD (sinon voir kernel.unprivileged_userns_clone,
#     section 1, et net.ipv4.ip_forward pour le bridge networking)
#   - Swap en zram, pas de swap physique sur l'eMMC (sinon vm.swappiness en
#     section 6 doit être revu à la baisse pour limiter l'usure)
#   - ufw actif avec des règles en "deny incoming" par défaut (ce fichier ne
#     remplace pas un firewall — voir la note ufw en fin de fichier)
#   - Machine allumée en permanence → priorité longévité eMMC + fail-safe panic
#
# INSTALLATION
#   sudo cp 99-hardening.conf /etc/sysctl.d/99-hardening.conf
#   sudo sysctl --system
#
# VÉRIFICATION
#   sudo sysctl --system 2>&1 | grep -i "99-hardening"   # doit ne montrer aucune erreur
#   sysctl -a 2>/dev/null | grep -E "rp_filter|syncookies|kptr_restrict|dirty_"
#
# =============================================================================


# -----------------------------------------------------------------------------
# 1. DURCISSEMENT NOYAU (KERNEL)
# -----------------------------------------------------------------------------

kernel.kptr_restrict              = 2       # Masque les adresses noyau dans /proc (anti-bypass KASLR)
kernel.dmesg_restrict             = 1       # dmesg réservé à root
kernel.yama.ptrace_scope          = 1       # ptrace limité aux enfants directs (anti-injection de process)
kernel.unprivileged_bpf_disabled  = 1       # BPF interdit aux non-root (CVEs fréquents)
net.core.bpf_jit_harden           = 2       # Durcit le JIT BPF contre l'exploitation de bugs du JIT
kernel.kexec_load_disabled        = 1       # Bloque le rechargement noyau via kexec
kernel.sysrq                      = 0       # Désactive SysRq (inutile en admin à distance)
kernel.perf_event_paranoid        = 3       # perf_event_open réservé à root
kernel.randomize_va_space         = 2       # ASLR complet (stack, heap, mmap)
vm.mmap_min_addr                  = 65536   # Anti-exploitation des NULL pointer deref
fs.suid_dumpable                  = 0       # Pas de core dump pour les binaires setuid/setgid

# Aucun conteneur confirmé → durci. ⚠️ Repasser à 1 avant d'installer Docker/Podman/LXD.
kernel.unprivileged_userns_clone  = 0

# Serveur headless 24/7 → reboot propre plutôt que rester planté après un oops.
kernel.panic                       = 10      # Reboot auto 10s après un kernel panic
kernel.panic_on_oops               = 1       # Déclenche un panic (donc le reboot) sur un oops noyau

# Bloque tout chargement de module après le boot (anti-rootkit LKM). Nécessite un
# reboot pour annuler ; décommente seulement si tous les modules utiles (USB, etc.)
# sont déjà chargés au boot.
# kernel.modules_disabled = 1


# -----------------------------------------------------------------------------
# 2. DURCISSEMENT SYSTÈME DE FICHIERS
# -----------------------------------------------------------------------------

fs.protected_symlinks  = 1   # Anti race-condition sur symlinks dans /tmp
fs.protected_hardlinks = 1   # Bloque les hardlinks vers des fichiers non possédés
fs.protected_fifos     = 2   # Protège les FIFOs dans les dossiers sticky (même possédés par root)
fs.protected_regular   = 2   # Protège les fichiers réguliers dans les dossiers sticky


# -----------------------------------------------------------------------------
# 3. RÉSEAU IPv4
# -----------------------------------------------------------------------------

net.ipv4.tcp_syncookies                     = 1       # Anti SYN flood
net.ipv4.tcp_synack_retries                 = 3       # Réduit la fenêtre d'une demi-connexion SYN flood (~21s)
net.ipv4.tcp_max_orphans                    = 4096    # Plafonne les sockets orphelines (anti-épuisement mémoire)

# rp_filter strict : ok tant qu'il n'y a pas de multi-homing/routage asymétrique.
net.ipv4.conf.all.rp_filter                 = 1       # Anti IP spoofing
net.ipv4.conf.default.rp_filter             = 1

net.ipv4.conf.all.accept_source_route       = 0       # Refuse le source routing IP
net.ipv4.conf.default.accept_source_route   = 0
net.ipv4.conf.all.accept_redirects          = 0       # Ignore les redirections ICMP (anti-MITM)
net.ipv4.conf.default.accept_redirects      = 0
net.ipv4.conf.all.secure_redirects          = 0
net.ipv4.conf.default.secure_redirects      = 0
net.ipv4.conf.all.send_redirects            = 0       # N'émet pas de redirections ICMP (pas un routeur)
net.ipv4.conf.default.send_redirects        = 0

net.ipv4.conf.all.log_martians              = 1       # Log les paquets spoofés (coût eMMC négligeable, repasser à 0 si flood de logs)
net.ipv4.conf.default.log_martians          = 1

net.ipv4.icmp_echo_ignore_broadcasts        = 1       # Anti-Smurf
net.ipv4.icmp_ignore_bogus_error_responses  = 1       # Ignore les erreurs ICMP malformées
net.ipv4.icmp_ratelimit                     = 100     # Anti scan/flood ICMP (100 paquets/s max)
net.ipv4.tcp_rfc1337                        = 1       # Anti TIME-WAIT assassination

# AdGuard Home ne fait que du DNS, aucun routage nécessaire.
# ⚠️ Repasser à 1 si VPN gateway / partage de connexion / routage inter-VLAN un jour.
net.ipv4.ip_forward                         = 0


# -----------------------------------------------------------------------------
# 4. RÉSEAU IPv6
# -----------------------------------------------------------------------------

net.ipv6.conf.all.accept_source_route      = 0   # Refuse le source routing IPv6
net.ipv6.conf.default.accept_source_route  = 0
net.ipv6.conf.all.accept_redirects         = 0   # Ignore les redirections ICMPv6
net.ipv6.conf.default.accept_redirects     = 0

# ⚠️ Laisse à 1 si ton IPv6 dépend du SLAAC de ta box (sinon perte de connectivité IPv6).
net.ipv6.conf.all.accept_ra                = 1   # Accepte les Router Advertisements
net.ipv6.conf.default.accept_ra            = 1

net.ipv6.conf.all.forwarding               = 0   # Pas de routage IPv6


# -----------------------------------------------------------------------------
# 5. NETFILTER / CONNTRACK (nécessite un firewall actif : ufw, nftables, iptables)
# -----------------------------------------------------------------------------
# Ces clés n'existent que si le module nf_conntrack est chargé. Sans firewall
# actif, sysctl --system affichera des erreurs "unknown key" pour ces 3 lignes
# (non bloquantes) — mets-les en commentaire si tu n'utilises aucun firewall.

net.netfilter.nf_conntrack_tcp_loose  = 0       # Mode strict : exige la poignée de main TCP complète
net.netfilter.nf_conntrack_max        = 65536   # Table de connexions suivies (anti-épuisement par flood)
net.netfilter.nf_conntrack_buckets    = 16384   # Hash table, ~1/4 de nf_conntrack_max


# -----------------------------------------------------------------------------
# 6. PRÉSERVATION eMMC — regroupement des écritures, cache, swap
# -----------------------------------------------------------------------------
# ⚠️ COMPROMIS : retarder l'écriture augmente la perte de données possible en cas
# de coupure brutale (~60s de données non écrites ci-dessous, contre ~30s par
# défaut). Raisonnable ici (pas de données critiques non sauvegardées ailleurs).
# Sans onduleur/alim stable, redescends dirty_expire/writeback_centisecs à 3000/500.
# Le swap étant en zram, vm.swappiness n'affecte pas l'usure eMMC, juste la perf.

vm.swappiness                  = 10      # Swap modéré (zram, pas d'usure eMMC)
vm.vfs_cache_pressure          = 50      # Garde le cache inode/dentry plus longtemps (moins de relectures)
vm.dirty_expire_centisecs      = 6000    # Page éligible à l'écriture après 60s (déf. 30s)
vm.dirty_writeback_centisecs   = 6000    # Flusher réveillé toutes les 60s (déf. 5s) → écritures groupées
vm.dirty_background_ratio      = 10      # Seuil flush async (~1,6 Go sur 16 Go de RAM)
vm.dirty_ratio                 = 20      # Seuil flush sync bloquant (garde-fou anti-explosion mémoire)
vm.min_free_kbytes             = 262144  # ~256 Mo RAM libre garantie (anti-OOM)
vm.overcommit_memory           = 1       # Requis pour Node.js/V8 (fork, allocations larges)


# -----------------------------------------------------------------------------
# 7. OPTIONS AVANCÉES / OPTIONNELLES (désactivées par défaut)
# -----------------------------------------------------------------------------
# Décommente seulement si tu comprends l'impact.

# kernel.yama.ptrace_scope           = 2    # Admin-only (casse gdb/strace non-root)
# net.ipv4.tcp_timestamps            = 0    # Réduit le fingerprinting (casse PAWS, perf réseau dégradée)
# net.ipv6.conf.all.disable_ipv6     = 1    # Désactive IPv6 (vérifie mDNS/Avahi avant)
# net.ipv6.conf.default.disable_ipv6 = 1
# vm.mmap_rnd_bits                   = 32   # Entropie ASLR mmap supplémentaire (max arm64 : 33)
# vm.mmap_rnd_compat_bits            = 16
# vm.laptop_mode                     = 5    # Batching d'écriture agressif (latence 1ère écriture après idle)


# =============================================================================
# 8. HORS SYSCTL — actions complémentaires pour la longévité eMMC
# =============================================================================
# La plus grosse source d'écritures sur ce Pi est probablement AdGuard Home
# (query log + stats DB en continu), pas le noyau — commence par là.
#
#   • AdGuard Home → Réglages → Confidentialité : réduis la rétention du query
#     log (ou désactive-le) et la rétention des statistiques.
#
#   • fstrim (si l'eMMC supporte TRIM) :
#       lsblk --discard                  # vérifie DISC-GRAN > 0
#       systemctl status fstrim.timer    # souvent déjà actif par défaut sur Ubuntu Server (preset)
#       sudo systemctl enable --now fstrim.timer   # seulement si absent/inactif ci-dessus
#
#   • /etc/fstab, partition racine (ext4 supposé) — voir README.md section 4
#     pour la procédure complète. Ajoute ,commit=60,x-systemd.growfs aux
#     options déjà présentes sur la ligne existante, pas besoin de retrouver
#     l'UUID. noatime = zéro écriture de métadonnées à la lecture ; commit=60
#     espace les commits du journal ext4 (à coordonner avec dirty_writeback
#     ci-dessus) ; x-systemd.growfs étend la partition au boot si besoin.
#
#   • journald (logs systemd) : voir le fichier compagnon 99-journald-emmc.conf,
#     à déposer dans /etc/systemd/journald.conf.d/ — logs 100% en RAM (zéro
#     écriture eMMC), perdus à chaque reboot. Implique de ne plus pouvoir
#     utiliser journalctl -b -1 pour diagnostiquer un problème au démarrage.
#
#   • /tmp : déjà en tmpfs par défaut sur Ubuntu Server. Vérifie : findmnt /tmp
#
#   • zram : vérifie que c'est actif : systemctl status zramswap ; zramctl
# =============================================================================
